name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'
    - run: npm install
    - run: npm test

      uses: azure/webapps-deploy@v3
      with:
        app-name: 'mi-app-Jeremy-01'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
